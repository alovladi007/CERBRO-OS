# GENERATED by scripts/gen-host-configs.mjs from web/app/js/policy.mjs and server/openai-ranges.json — do not edit by hand; run `npm run gen:hosts`.
#
# Security + cache headers are defined once, in web/_headers (Netlify reads it from the publish
# directory). They are not repeated here because Netlify merges matching rules from both sources
# and duplicated values (e.g. "DENY, DENY") are invalid for some headers.
# Content-Security-Policy applied via web/_headers:
#   default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://www.ebi.ac.uk https://eutils.ncbi.nlm.nih.gov https://clinicaltrials.gov https://api.dandiarchive.org https://openneuro.org; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests

[build]
  publish = "web"
  command = "echo 'Cerebro OS is buildless; publishing web/'"

[build.environment]
  NODE_VERSION = "22"

# Refuse OpenAI agents (user agent, published IP ranges, ChatGPT Referer/Origin) before the CDN
# serves anything. robots.txt and ai.txt stay readable so crawlers can learn the policy.
[[edge_functions]]
  path = "/*"
  function = "block-openai"
  excludedPath = ["/robots.txt","/ai.txt"]

[[redirects]]
  from = "/app"
  to = "/app/"
  status = 301
  force = true
