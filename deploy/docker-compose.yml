# Cerebro OS — local / single-host deployment.
#   docker compose -f deploy/docker-compose.yml up --build
# Optional static nginx edge: docker compose -f deploy/docker-compose.yml --profile nginx up
# Ports follow docs/PORTS.md: 4700 app, 4702 nginx, bound to 127.0.0.1 only. Scale with WORKERS (cluster mode) or k8s replicas.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cerebro-os:latest
    environment:
      PORT: "4700"
      WORKERS: "auto"           # node:cluster, one worker per CPU
      RATE_LIMIT: "300"         # requests / minute / client IP (per worker)
      REFRESH_OPENAI_RANGES: "1" # pull OpenAI's published ranges at boot + every 24h (snapshot fallback)
      TRUST_PROXY: "0"          # set to "1" only behind a proxy that sets X-Forwarded-For
      LOG: "1"
    ports:
      - "127.0.0.1:4700:4700"   # fixed host port — no random ephemeral ports (avoids 55434/56381/58000 etc.)
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 15s

  # Optional: static nginx edge using the generated config (same OpenAI block, no Node needed).
  nginx:
    profiles: ["nginx"]
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:4702:80"
    volumes:
      - ../web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./openai-ip-deny.conf:/etc/nginx/openai-ip-deny.conf:ro
    restart: unless-stopped
