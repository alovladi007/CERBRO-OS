# Cerebro OS — local / single-host deployment.
#   docker compose -f deploy/docker-compose.yml up --build
# Scale out on one host:   docker compose -f deploy/docker-compose.yml --profile nginx up --scale app=3
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: cerebro-os:latest
    environment:
      PORT: "8080"
      WORKERS: "auto"           # node:cluster, one worker per CPU
      RATE_LIMIT: "300"         # requests / minute / client IP (per worker)
      REFRESH_OPENAI_RANGES: "1" # pull OpenAI's published ranges at boot + every 24h (snapshot fallback)
      TRUST_PROXY: "0"          # set to "1" only behind a proxy that sets X-Forwarded-For
      LOG: "1"
    ports:
      - "8080"                  # ephemeral host port so --scale works; use "8080:8080" for a single replica
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 15s

  # Optional: static nginx edge using the generated config (same OpenAI block, no Node needed).
  nginx:
    profiles: ["nginx"]
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ../web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./openai-ip-deny.conf:/etc/nginx/openai-ip-deny.conf:ro
    restart: unless-stopped
