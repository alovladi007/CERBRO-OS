# GENERATED by scripts/gen-host-configs.mjs from web/app/js/policy.mjs and server/openai-ranges.json — do not edit by hand; run `npm run gen:hosts`.
#
# Install (official nginx image): copy this file to /etc/nginx/conf.d/default.conf (it is
# http-context: maps + one server block), copy deploy/openai-ip-deny.conf to
# /etc/nginx/openai-ip-deny.conf, and copy web/ to /usr/share/nginx/html.
#
# Behind a load balancer, uncomment the realip lines so $remote_addr (used by the geo block)
# is the real client address:
# set_real_ip_from 10.0.0.0/8;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

# 1) OpenAI user agents
map $http_user_agent $cerebro_openai_ua {
    default 0;
    "~*\b(GPTBot|ChatGPT-User|OAI-SearchBot|ChatGPT-Agent|ChatGPT|OpenAI)\b" 1;
}

# 2) OpenAI published IP ranges (regenerate with `npm run refresh:openai`)
geo $cerebro_openai_ip {
    default 0;
    include /etc/nginx/openai-ip-deny.conf;
}

# 3) Requests initiated from ChatGPT / OpenAI pages (browsing, canvas, embedding)
map $http_referer $cerebro_openai_ref {
    default 0;
    "~*^https?://([^/@]*\.)?((openai\.com|api\.openai\.com|chatgpt\.com|chat\.openai\.com|cdn\.openai\.com|oaistatic\.com|oaiusercontent\.com|openai\.azure\.com|sora\.com)(:[0-9]+)?(/|$)|openai\.)" 1;
}
map $http_origin $cerebro_openai_origin {
    default 0;
    "~*^https?://([^/@]*\.)?((openai\.com|api\.openai\.com|chatgpt\.com|chat\.openai\.com|cdn\.openai\.com|oaistatic\.com|oaiusercontent\.com|openai\.azure\.com|sora\.com)(:[0-9]+)?(/|$)|openai\.)" 1;
}

# robots.txt and ai.txt are served to everyone so crawlers can read the policy.
map $uri $cerebro_policy_exempt {
    default 0;
    /robots.txt 1;
    /ai.txt 1;
}

map "$cerebro_policy_exempt$cerebro_openai_ua$cerebro_openai_ip$cerebro_openai_ref$cerebro_openai_origin" $cerebro_openai_block {
    default 1;
    "00000" 0;
    "~^1" 0;
}

map $uri $cerebro_cache_control {
    default "public, max-age=3600, must-revalidate";
    "~/$" "no-cache";
    "~*\.html?$" "no-cache";
    /app "no-cache";
    /sw.js "no-cache";
    /app/sw.js "no-cache";
    /robots.txt "no-cache";
    /ai.txt "no-cache";
    /.well-known/security.txt "no-cache";
    /manifest.webmanifest "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Security headers from policy.mjs (repeated in @openai_blocked because add_header does not inherit
    # into blocks that define their own).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://www.ebi.ac.uk https://eutils.ncbi.nlm.nih.gov https://clinicaltrials.gov https://api.dandiarchive.org https://openneuro.org; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Robots-Tag "GPTBot: noindex, nofollow, noarchive, nosnippet, noimageindex; ChatGPT-User: noindex, nofollow, noarchive, nosnippet; OAI-SearchBot: noindex, nofollow, noarchive, nosnippet; noai, noimageai" always;
    add_header Cache-Control $cerebro_cache_control always;

    # OpenAI agents → 403 (418 is an internal sentinel so genuine 403s keep the default page).
    error_page 418 = @openai_blocked;
    if ($cerebro_openai_block) {
        return 418;
    }

    location @openai_blocked {
        default_type "text/plain; charset=utf-8";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://www.ebi.ac.uk https://eutils.ncbi.nlm.nih.gov https://clinicaltrials.gov https://api.dandiarchive.org https://openneuro.org; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 403 "Access by OpenAI agents is not permitted by the Cerebro OS operator.\n";
    }

    error_page 404 /404.html;

    # Dotfiles are never served, except /.well-known/.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location ~* \.mjs$ {
        types { }
        default_type "text/javascript; charset=utf-8";
        try_files $uri =404;
    }

    location ~* \.webmanifest$ {
        types { }
        default_type "application/manifest+json; charset=utf-8";
        try_files $uri =404;
    }

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
